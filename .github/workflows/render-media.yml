name: Render editorial media
on:
  push:
    branches: [redesign/cinematic-editorial]
    paths:
      - scripts/render-media.sh
      - .github/workflows/render-media.yml
  workflow_dispatch:
permissions:
  contents: write
jobs:
  media:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - name: Confirm renderer
        run: ffmpeg -version
      - name: Render optimized posters and muted loops
        run: bash scripts/render-media.sh
      - name: Commit produced media to redesign branch
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add assets/media/*.webp assets/media/*.mp4
          if ! git diff --cached --quiet; then
            git commit -m "Render optimized editorial posters and muted hero films"
            git push origin HEAD:redesign/cinematic-editorial
          fi
