name: Browser smoke test
on:
  push:
    branches: [redesign/cinematic-editorial]
    paths:
      - index.html
      - assets/site.css
      - assets/site.js
      - server.mjs
      - tests/browser-smoke.mjs
      - .github/workflows/browser-smoke.yml
  pull_request:
    branches: [main]
permissions:
  contents: write
jobs:
  browsers:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm install --no-save playwright
      - run: npx playwright install --with-deps chromium webkit
      - run: node tests/browser-smoke.mjs
      - name: Save review screenshots to redesign branch
        run: |
          mkdir -p docs/screenshots
          cp artifacts/*.jpg docs/screenshots/
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/screenshots/
          if ! git diff --cached --quiet; then
            git commit -m "Save redesign browser review screenshots"
            git push origin HEAD:redesign/cinematic-editorial
          fi
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: redesign-browser-screenshots
          path: artifacts/
          if-no-files-found: ignore
